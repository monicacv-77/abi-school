<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" font-family="Georgia, serif">
<rect width="480" height="300" fill="#fbf7ee"/>
<text x="16" y="28" font-size="19" font-weight="bold" fill="#2b2b2b">Storehouse</text>
<rect x="0" y="240" width="480" height="60" fill="#8a6a48" opacity=".35"/><line x1="0" y1="240" x2="480" y2="240" stroke="#8a6a48" stroke-width="2"/><rect x="90" y="120" width="300" height="120" fill="#e8dcc4" stroke="#2b2b2b"/><polygon points="80,122 400,122 240,60" fill="#d6b25a" stroke="#2b2b2b"/><ellipse cx="130" cy="215" rx="20" ry="25" fill="#a0703c" stroke="#2b2b2b"/><ellipse cx="180" cy="215" rx="20" ry="25" fill="#a0703c" stroke="#2b2b2b"/><ellipse cx="230" cy="215" rx="20" ry="25" fill="#a0703c" stroke="#2b2b2b"/><rect x="280" y="190" width="60" height="50" fill="#d9c69c" stroke="#2b2b2b"/><line x1="180" y1="200" x2="130" y2="272" stroke="#2b2b2b" stroke-width="1" stroke-dasharray="3 2"/><circle cx="180" cy="200" r="2.5" fill="#2b2b2b"/><text x="134" y="277" font-size="14" fill="#2b2b2b" text-anchor="start">barrels of food and gunpowder</text><line x1="310" y1="200" x2="380" y2="272" stroke="#2b2b2b" stroke-width="1" stroke-dasharray="3 2"/><circle cx="310" cy="200" r="2.5" fill="#2b2b2b"/><text x="384" y="277" font-size="14" fill="#2b2b2b" text-anchor="start">tools</text>
